[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
; Supersample: render the canvas at >=2x the CSS pixel size so the browser
; downscales a sharper image (the Compatibility/WebGL renderer has no MSAA
; here, and 1:1 CSS-pixel rendering looks soft).
html/head_include="<script>(function(){var d=Math.max(window.devicePixelRatio||1,2);Object.defineProperty(window,'devicePixelRatio',{get:function(){return d;},configurable:true});})();</script>"
html/canvas_resize_policy=2
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
